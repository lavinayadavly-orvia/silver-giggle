<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Giggle</title>
<link rel="icon" href="assets/silver-giggle-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/silver-giggle-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root{
  --bg:#f7f8f6; --surface:#fcfcfb; --card:#ffffff; --ink:#1b2024; --muted:#5b6268; --faint:#8a9095; --rule:#e2e5e6;
  --accent:#266b5f; --accent-ink:#ffffff; --accent-soft:#e7f1ee; --blue:#256abf; --blue-soft:#e6eef9;
  --s100:#cde2fb; --s200:#9ec5f4; --s300:#6da7ec; --s400:#3987e5; --s500:#256abf; --s600:#184f95; --s700:#0d366b;
  --dk:#d9dcdd; --good:#0ca30c; --warn:#b77900; --crit:#d03b3b; --crit-soft:#fbe7e7; --warn-soft:#fdf3dc; --good-soft:#e3f4e3;
  --serif:"Source Serif 4",Georgia,serif; --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121415; --surface:#1a1a19; --card:#1f2223; --ink:#eef0f1; --muted:#a9b0b5; --faint:#7d858a; --rule:#323739;
    --accent:#5598e7; --accent-ink:#0b1320; --accent-soft:#1d2c3f;
    --dk:#3a3f42; --warn:#e0a526; --crit:#e66767; --crit-soft:#3a2222; --warn-soft:#3a3120; --good-soft:#1d3320;
  }
}
:root[data-theme="dark"]{
  --bg:#121415; --surface:#1a1a19; --card:#1f2223; --ink:#eef0f1; --muted:#a9b0b5; --faint:#7d858a; --rule:#323739;
  --accent:#5598e7; --accent-ink:#0b1320; --accent-soft:#1d2c3f;
  --dk:#3a3f42; --warn:#e0a526; --crit:#e66767; --crit-soft:#3a2222; --warn-soft:#3a3120; --good-soft:#1d3320;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:
  linear-gradient(180deg, rgba(38,107,95,.09), transparent 420px),
  linear-gradient(90deg, rgba(37,106,191,.07), transparent 44%),
  var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(247,248,246,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:12px 16px}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{display:inline-flex;align-items:center;text-decoration:none}
.brand img{display:block;width:174px;height:auto;border-radius:6px}
.tabs{display:none;gap:4px;margin-left:auto;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:3px}
body[data-admin="true"] .tabs{display:flex}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:1180px;margin:0 auto;padding-top:42px}
.narrow{max-width:780px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--serif);font-size:26px;line-height:1.2}
h2{font-family:var(--serif);font-size:20px;line-height:1.25}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:18px}
.intro{display:grid;gap:22px;padding:34px}
.intro-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:30px;align-items:center}
.intro h1{font-size:44px;line-height:1.04}
.intro-copy{font-size:18px;line-height:1.55;max-width:620px}
.intro-panel{border:1px solid var(--rule);background:linear-gradient(180deg,var(--surface),#f3f7f5);border-radius:8px;padding:20px;display:grid;gap:14px}
.trust-list{display:grid;gap:12px}
.trust-item{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.trust-icon{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.trust-item b{display:block}
.trust-item span{display:block;color:var(--muted);font-size:13px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 11px;color:var(--muted);font-size:13px;font-weight:600}
.console-link{margin-left:auto;border:0;background:transparent;color:var(--faint);font-size:13px;font-weight:600;cursor:pointer;padding:8px}
.console-link:hover{color:var(--accent)}
.admin-login{max-width:460px;margin:0 auto}
.admin-login input{width:100%;border:1px solid var(--rule);border-radius:7px;padding:9px 11px;background:var(--surface)}
.admin-note{font-size:13px;color:var(--muted)}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--rule);background:var(--card);padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{border-radius:8px;padding:10px 14px;font-size:14px}
.banner.warn{background:var(--warn-soft)} .banner.crit{background:var(--crit-soft)} .banner.info{background:var(--accent-soft)} .banner.good{background:var(--good-soft)}
/* survey */
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.secname{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.q{padding:18px 0;border-top:1px solid var(--rule);display:grid;gap:10px}
.q:first-of-type{border-top:0}
.qid{font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.qtext{font-weight:600;font-size:16px}
.qhelp{font-size:13px;color:var(--muted)}
.qerr{font-size:13px;color:var(--crit);font-weight:600}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:7px;padding:8px 12px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .rk{min-width:22px;height:22px;border-radius:11px;border:1px solid var(--rule);display:inline-grid;place-items:center;font-size:12px;font-weight:700}
.opt.sel .rk{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.txt{width:100%;border:1px solid var(--rule);border-radius:6px;padding:7px 10px;background:var(--surface)}
.num{width:120px;border:1px solid var(--rule);border-radius:6px;padding:7px 10px;background:var(--surface);font-variant-numeric:tabular-nums}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.grid-q{display:grid;gap:8px}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--rule)}
.grow:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer;background:var(--surface)}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gsc{grid-template-columns:1fr}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
/* dashboard */
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--rule)}
.filters label{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.filters select{border:1px solid var(--rule);border-radius:6px;padding:5px 8px;background:var(--card)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px}
.kpi b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.dsec{display:grid;gap:12px;padding-top:22px}
.dsec > header{display:grid;gap:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px}
.cards > *, .dsec > *, .card{min-width:0}
.cards.wide{grid-template-columns:1fr}
.ctitle{display:grid;gap:2px;margin-bottom:10px}
.ctitle .qid{font-size:11px}
.n{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:13px}
.bar .lab{overflow-wrap:anywhere}
.track{display:block;height:12px;background:transparent;position:relative;min-width:0}
.fill{display:block;height:100%;background:var(--s500);border-radius:0 4px 4px 0;min-width:2px}
.val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.stack100{display:flex;height:14px;gap:2px;min-width:0}
.stack100 i{display:block;height:100%}
.stack100 i:first-child{border-radius:4px 0 0 4px} .stack100 i:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hm{overflow-x:auto}
.hm table{border-collapse:separate;border-spacing:2px;width:100%;min-width:620px;font-size:13px}
.hm th{font-weight:600;color:var(--muted);text-align:center;padding:4px;font-size:12px}
.hm th.rl{text-align:left}
.hm td{text-align:center;padding:8px 4px;border-radius:4px;font-variant-numeric:tabular-nums;font-weight:600}
.hm td.rl{text-align:left;font-weight:400;background:transparent;padding-left:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600}
.tbl td.r{text-align:right;font-variant-numeric:tabular-nums}
details.all{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
details.all summary{cursor:pointer;font-weight:600}
details.all .cards{margin-top:12px}
details.all .card{background:var(--surface)}
.quotes{display:grid;gap:6px;font-size:13px;max-height:260px;overflow:auto}
.quotes div{border-left:3px solid var(--rule);padding-left:8px}
.ai{white-space:pre-wrap;font-size:14px;line-height:1.6}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:var(--card);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;display:none;line-height:1.4}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sim{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:10px}
.bar.ev{grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 118px}
@media (max-width:720px){ .intro-grid{grid-template-columns:1fr}.metric-row{grid-template-columns:1fr 1fr} }
@media (max-width:620px){ .bar.ev{grid-template-columns:minmax(0,1fr) 110px} .bar.ev .lab{grid-column:1/-1} .filters{position:static} .bar{grid-template-columns:minmax(0,1fr) 80px 40px} .grow{grid-template-columns:1fr} .tabs{margin-left:0} .filters{top:calc(env(safe-area-inset-top,0px) + 96px)} }
@media (prefers-reduced-motion: reduce){ .progress i{transition:none} }
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <a class="brand" href="index.html" aria-label="Silver Giggle home"><img src="assets/silver-giggle-logo-horizontal-on-navy.svg" alt="Silver Giggle"></a>
  <button class="console-link" type="button" data-view="dash">Admin login</button>

    <button class="tab" role="tab" id="tab-survey" aria-selected="true" data-view="survey">Survey</button>
    <button class="tab" role="tab" id="tab-dash" aria-selected="false" data-view="dash">Dashboard</button>
    <button class="tab" role="tab" id="tab-data" aria-selected="false" data-view="data">Data</button>
  </div>
</div></div>

<main class="wrap">
  <section id="view-survey" class="narrow stack"></section>
  <section id="view-dash" hidden></section>
  <section id="view-data" class="narrow stack" hidden></section>
</main>

function buildResponsePdf(doc) {
  const a = doc.answers || {};

    `Submitted: ${doc.submittedAt ? new Date(doc.submittedAt).toLocaleString('en-IN') : ''}`,

      <p class="muted">This Cloudflare-ready static build stores responses in local browser storage. For live multi-respondent fieldwork, place it behind Cloudflare Access and export CSVs from each collection device, or connect a server-side form endpoint later.</p></div>
    <div class="card stack"><h2>Export</h2>
      <p class="muted">One row per response, one column per answer. Multiple choices and rankings are coded like <code>1|4|7</code>; grids use <code>C3_r1</code>, <code>C3_r2</code> and so on; codes follow the questionnaire workbook.</p>
      <div class="row"><button class="btn primary" id="expBtn" ${realDocs.length ? '' : 'disabled'}>Download responses (CSV)</button><button class="btn" id="tplBtn">Download blank template (CSV)</button></div></div>
    <div class="card stack"><h2>Import responses collected elsewhere</h2>
      <p class="muted">Use this when fieldwork runs on another survey platform. Map that platform’s export to the blank template columns, then upload. Imported rows are marked <code>source = import</code> and appear in the dashboard immediately.</p>
      <div class="row"><input type="file" id="impFile" accept=".csv,text/csv"><button class="btn" id="impBtn">Import</button><button class="btn" id="clearBtn" ${realDocs.length ? '' : 'disabled'}>Clear local records</button></div>
      ${importMsg ? `<div class="banner ${/fail|error|No /i.test(importMsg) ? 'crit' : 'good'}">${esc(importMsg)}</div>` : ''}</div>
    <div class="card stack"><h2>Quota targets</h2><p class="muted">Used by the fieldwork chart. Saved in this browser only.</p>
      <div class="row">${['G','E','D','C'].map(s => `<label class="chk" style="color:var(--ink)">${SPEC_NAME[s]} <input class="num" style="width:80px" type="number" min="1" id="tgt-${s}" value="${targets[s]}"></label>`).join('')}</div></div>
    <div class="card stack"><h2>Before fieldwork</h2>
      <ul style="margin:0;padding-left:20px;display:grid;gap:6px">
        <li>Deploy behind Cloudflare Access or another authentication layer if respondents should be restricted.</li>
        <li>Obtain institutional permissions and ethics review as each institute requires.</li>
        <li>Pilot with 2-3 respondents per specialty, check timing on the dashboard, then clear pilot rows before analysis.</li>
      </ul></div>`;
  const e = dataV.querySelector('#expBtn'); if (e) e.onclick = () => dl('semaglutide_survey_responses.csv', toCSV(realDocs));
  const t = dataV.querySelector('#tplBtn'); if (t) t.onclick = () => dl('semaglutide_survey_template.csv', columns().join(','));
  ['G','E','D','C'].forEach(s => { const inp = dataV.querySelector('#tgt-' + s); inp.onchange = () => { const tg = store.get('sem_targets') || { G: 25, E: 25, D: 25, C: 25 }; tg[s] = Math.max(1, +inp.value || 1); store.set('sem_targets', tg); }; });
  const ib = dataV.querySelector('#impBtn'); if (ib) ib.onclick = doImport;
  const cb = dataV.querySelector('#clearBtn'); if (cb) cb.onclick = () => { realDocs = []; persistDocs(); importMsg = 'Local records cleared.'; renderData(); if (VIEW === 'dash') renderDash(); };
}
async function dl(filename, data) {
  try {
    const blob = new Blob([data], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch (e) { importMsg = 'Download failed in this browser.'; renderData(); }
}
async function doImport() {
  const f = dataV.querySelector('#impFile').files[0];
  if (!f) { importMsg = 'No file chosen.'; return renderData(); }
  const rows = parseCSV(await f.text());
  if (rows.length < 2) { importMsg = 'No data rows found in the file.'; return renderData(); }
  const head = rows[0].map(h => h.trim()); const need = ['A1'];
  if (!need.every(c => head.includes(c))) { importMsg = 'Import failed: the file needs template columns, including A1 (specialty).'; return renderData(); }
  let ok = 0, bad = 0;
  for (const r of rows.slice(1)) {
    const obj = Object.fromEntries(head.map((h, i) => [h, r[i] ?? '']));
    const a = unflatten(obj); const s = SPEC[a.A1];
    if (!s) { bad++; continue; }
    const doc = { status: obj.status || 'complete', reason: null, version: 'v2.0', source: 'import', specialty: s, inst: a.A2 ?? null, designation: a.A4 ?? null, startedAt: obj.startedAt || null, submittedAt: obj.submittedAt || new Date().toISOString(), durationSec: obj.durationSec ? Number(obj.durationSec) : null, attentionFail: a.D4 ? a.D4[8] !== 4 : false, answers: a };
    try { addDoc(doc); ok++; } catch (e) { bad++; }
  }
  importMsg = `Imported ${ok} row${ok === 1 ? '' : 's'}${bad ? `; ${bad} skipped (missing or invalid specialty, or save error)` : ''}.`;
  renderData();
}

/* ---------------- tooltip ---------------- */
const tip = document.getElementById('tip');
document.addEventListener('mousemove', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 16) + 'px'; });

/* ---------------- boot ---------------- */
renderSurvey();
const requestedView = location.hash.replace('#', '');
if (requestedView === 'admin') show('dash');
</script>
</body>
